<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">LipMatch - 理想の色を見つけよう</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Noto+Serif+KR:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2691NYJPGX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2691NYJPGX');
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* スクリーンショットの非常に淡いクリーム色 */
      background-color: #F3EAE4;
      background-image: radial-gradient(ellipse at 30% 20%, #FDF5F0 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 80%, #EDE0D8 0%, transparent 50%);
      color: #4A2C1A;
      font-family: 'Shippori Mincho', serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── HEADER ── */
    .lm-header {
      text-align: center;
      padding: 56px 24px 40px;
    }
    .lm-eyebrow {
      font-size: 10px;
      letter-spacing: 0.4em;
      color: #B8917A;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 300;
    }
    .lm-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 62px;
      font-weight: 600;
      line-height: 1;
      color: #3B2010;
      letter-spacing: -0.01em;
    }
    .lm-logo em {
      font-style: italic;
      color: #B8744A;
      font-weight: 400;
    }
    .lm-subtitle {
      margin-top: 16px;
      font-size: 13px;
      color: #B8917A;
      letter-spacing: 0.22em;
      font-weight: 300;
    }
    .lm-divider {
      width: 36px;
      height: 1px;
      background: #C4A088;
      margin: 22px auto 0;
    }

    /* ── MAIN CONTAINER ── */
    .lm-wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── DASHBOARD CARD ── */
    .lm-card {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 28px;
      padding: 36px 32px 32px;
      /* スクリーンショットの柔らかいシャドウ */
      box-shadow:
        0 2px 6px rgba(120, 70, 40, 0.04),
        0 8px 32px rgba(120, 70, 40, 0.09),
        0 24px 64px rgba(120, 70, 40, 0.06);
      margin-bottom: 52px;
      backdrop-filter: blur(12px);
    }
    .lm-card-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #B8744A;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lm-card-label::before {
      content: '◆';
      font-size: 7px;
      color: #D4A882;
    }

    /* ── カラーピッカー エリア ── */
    .lm-picker-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 32px;
    }

    /* 破線リング＋カラーサークル */
    .lm-ring-wrap {
      position: relative;
      flex-shrink: 0;
      /* 外側の破線リング分を含めた全体サイズ */
      width: 100px;
      height: 100px;
      cursor: pointer;
    }
    /* 破線の外リング */
    .lm-ring-dashed {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed #C8A48A;
      /* 破線の内側に白い余白を作る */
      background: transparent;
      pointer-events: none;
    }
    /* 白い余白レイヤー（破線とカラー円の間） */
    .lm-ring-gap {
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      pointer-events: none;
    }
    /* カラー表示円 */
    #color-preview {
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background-color: #BE185D;
      box-shadow:
        0 2px 8px rgba(120, 60, 30, 0.20),
        0 6px 20px rgba(120, 60, 30, 0.15);
      transition: background-color 0.25s ease;
    }
    /* 不可視のカラーピッカー input（リング全体をタップ可能に） */
    #color-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border-radius: 50%;
      z-index: 10;
    }

    /* hex表示 ＋ ヒント */
    .lm-hex-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #hex-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 600;
      color: #3B2010;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    .lm-tap-hint {
      font-size: 11px;
      color: #C0A090;
      letter-spacing: 0.06em;
      font-weight: 300;
    }

    /* ── RGB スライダー ── */
    .lm-sliders { margin-bottom: 32px; }
    .lm-slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .lm-slider-row:last-child { margin-bottom: 0; }
    .lm-slider-label {
      font-size: 11px;
      color: #C0A090;
      width: 10px;
      flex-shrink: 0;
      font-weight: 400;
    }
    .lm-range {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      /* 初期値はJSで上書き */
    }
    /* サムネイル（つまみ）*/
    .lm-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      border: 2px solid #C8A48A;
      box-shadow: 0 1px 5px rgba(100, 50, 20, 0.18);
      transition: border-color 0.15s;
    }
    .lm-range::-webkit-slider-thumb:hover {
      border-color: #A06840;
    }
    .lm-range::-moz-range-thumb {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: white;
      border: 2px solid #C8A48A;
      box-shadow: 0 1px 5px rgba(100, 50, 20, 0.18);
    }
    .lm-slider-val {
      font-size: 11px;
      color: #C0A090;
      width: 28px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* ── 検索ボタン ── */
    #search-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(90deg, #8B4F2E 0%, #C08050 50%, #A06438 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 14px;
      letter-spacing: 0.2em;
      font-family: 'Shippori Mincho', serif;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(120, 60, 20, 0.25);
    }
    #search-btn:hover  { opacity: 0.88; }
    #search-btn:active { transform: scale(0.985); }

    /* ── RESULTS ── */
    #results-container { display: none; }
    #results-container.visible { display: block; }

    .lm-results-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      text-align: center;
      color: #3B2010;
      letter-spacing: 0.14em;
      margin-bottom: 20px;
    }
    .lm-results-rule {
      display: flex;
      align-items: center;
      margin-bottom: 28px;
    }
    .lm-results-rule::before,
    .lm-results-rule::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #D8C4B4;
    }
    .lm-results-rule span {
      color: #C4A088;
      font-size: 8px;
      padding: 0 12px;
    }

    #results-list { display: flex; flex-direction: column; gap: 16px; }

    .result-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow:
        0 2px 8px rgba(120, 70, 40, 0.06),
        0 8px 24px rgba(120, 70, 40, 0.07);
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.45s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .result-swatch-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .result-swatch {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid white;
      box-shadow:
        0 2px 8px rgba(120, 60, 30, 0.15),
        0 6px 20px rgba(120, 60, 30, 0.12);
    }
    .result-badge {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #8B5538;
      color: white;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .result-info { flex: 1; min-width: 0; }
    .result-brand {
      font-size: 10px;
      letter-spacing: 0.22em;
      color: #B8744A;
      text-transform: uppercase;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .result-name {
      font-family: 'Shippori Mincho', serif;
      font-size: 14px;
      font-weight: 600;
      color: #3B2010;
      line-height: 1.5;
      margin-bottom: 9px;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .matte-tag {
      display: inline-block;
      background: linear-gradient(135deg, #8B5538 0%, #A06438 100%);
      color: #FFF;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
      line-height: 1.6;
    }
    .result-hex-chip {
      display: inline-block;
      background: #F0E6DE;
      color: #9B7455;
      font-size: 10px;
      font-family: 'Courier New', monospace;
      padding: 3px 10px;
      border-radius: 99px;
      letter-spacing: 0.05em;
    }
    .result-right {
      flex-shrink: 0;
      text-align: right;
      min-width: 64px;
    }
    .result-pct {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 600;
      color: #3B2010;
      line-height: 1;
    }
    .result-pct sup {
      font-size: 15px;
      vertical-align: super;
    }
    .result-match-label {
      font-size: 8px;
      letter-spacing: 0.25em;
      color: #C0A090;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .result-bar {
      width: 56px;
      height: 3px;
      background: #EAD8CC;
      border-radius: 2px;
      margin-top: 10px;
      margin-left: auto;
      overflow: hidden;
    }
    .result-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #8B4F2E, #C08050);
      border-radius: 2px;
    }
    .result-shops {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }
    .shop-btn {
      font-size: 9px;
      letter-spacing: 0.04em;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 99px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .shop-btn:hover { opacity: 0.78; }
    .shop-btn-qoo { background: #FBF0E8; color: #9B5C3A; border: 1px solid #E8C4AC; }
    .shop-btn-amz { background: #FEF8EC; color: #A07820; border: 1px solid #ECD898; }

    /* ── footer ── */
    .lm-notice {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 24px 32px;
      text-align: center;
      font-size: 11px;
      color: #B8A090;
      line-height: 1.8;
      letter-spacing: 0.02em;
    }

    /* ── LANGUAGE SWITCHER ── */
    .lang-switcher {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 4px;
      z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 4px;
      box-shadow: 0 2px 12px rgba(120,60,20,0.12);
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: #B8917A;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Shippori Mincho', serif;
    }
    .lang-btn:hover { background: rgba(139,79,46,0.08); }
    .lang-btn.active {
      background: #8B5538;
      color: #FFF;
    }
    .lm-footer {
      text-align: center;
      padding: 24px 0 20px;
      font-size: 11px;
      color: #C4A088;
      letter-spacing: 0.06em;
      line-height: 1.8;
    }
    .lm-footer a {
      color: #B8744A;
      text-decoration: none;
    }
    .lm-footer a:hover {
      text-decoration: underline;
    }

    /* ── モード切り替えタブ ── */
    .lm-mode-tabs {
      display: flex;
      background: #F0E6DE;
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 24px;
      gap: 3px;
    }
    .lm-mode-tab {
      flex: 1;
      padding: 9px 6px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 11px;
      font-family: 'Shippori Mincho', serif;
      color: #B8917A;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }
    .lm-mode-tab.active {
      background: white;
      color: #3B2010;
      box-shadow: 0 1px 4px rgba(120,60,20,0.12);
    }

    /* ── 写真アップロードエリア ── */
    .lm-photo-area { display: none; }
    .lm-upload-zone {
      border: 2px dashed #C8A48A;
      border-radius: 18px;
      padding: 30px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.5);
    }
    .lm-upload-zone:hover { border-color: #A06840; background: rgba(255,255,255,0.8); }
    .lm-upload-zone-icon { font-size: 30px; margin-bottom: 8px; }
    .lm-upload-zone-text { font-size: 11px; color: #B8917A; letter-spacing: 0.08em; }

    .lm-photo-preview-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
      cursor: crosshair;
      box-shadow: 0 4px 20px rgba(120,60,20,0.15);
    }
    .lm-photo-preview-wrap.visible { display: block; }
    #photo-canvas { width: 100%; display: block; }
    .lm-pick-hint {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(59,32,16,0.72));
      color: white;
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 20px 16px 10px;
      text-align: center;
    }
    .lm-cursor-ring {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.5px solid white;
      box-shadow: 0 0 0 1.5px rgba(0,0,0,0.35);
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      transition: left 0.05s, top 0.05s;
    }
    .lm-extracted-preview {
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      margin-bottom: 16px;
      display: none;
    }
    .lm-extracted-preview.visible { display: flex; }
    .lm-extracted-swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(120,60,20,0.2);
      flex-shrink: 0;
    }
    .lm-extracted-info { flex: 1; }
    .lm-extracted-hex {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      color: #3B2010;
    }
    .lm-extracted-label { font-size: 10px; color: #B8917A; letter-spacing: 0.1em; }
    .lm-use-color-btn {
      font-size: 10px;
      font-family: 'Shippori Mincho', serif;
      padding: 8px 14px;
      background: linear-gradient(90deg, #8B4F2E 0%, #C08050 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.06em;
      font-weight: 600;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .lm-use-color-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <!-- ── LANGUAGE SWITCHER ── -->
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="switchLang('ja')">JP</button>
    <button class="lang-btn" onclick="switchLang('ko')">KR</button>
    <button class="lang-btn" onclick="switchLang('en')">EN</button>
  </div>

  <!-- ── HEADER ── -->
  <header class="lm-header">
    <p class="lm-eyebrow">Colour Matching</p>
    <h1 class="lm-logo">Lip<em>Match</em></h1>
    <p class="lm-subtitle" data-i18n="subtitle">理想の色を、あなたの唇へ。</p>
    <div class="lm-divider"></div>
  </header>

  <div class="lm-wrap">

    <!-- ── DASHBOARD CARD ── -->
    <div class="lm-card">
      <div class="lm-card-label" data-i18n="cardLabel">あなたの理想のリップカラー</div>

      <!-- ── モード切り替えタブ ── -->
      <div class="lm-mode-tabs">
        <button class="lm-mode-tab active" id="tab-color" onclick="switchMode('color')" data-i18n="tabColor">🎨 カラーを選ぶ</button>
        <button class="lm-mode-tab" id="tab-photo" onclick="switchMode('photo')" data-i18n="tabPhoto">📷 写真から抽出</button>
      </div>

      <!-- ── 写真アップロードエリア ── -->
      <div class="lm-photo-area" id="photo-area">
        <div class="lm-upload-zone" id="upload-zone" onclick="document.getElementById('photo-file-input').click()">
          <div class="lm-upload-zone-icon">📷</div>
          <div class="lm-upload-zone-text" data-i18n="uploadHint">画像をタップして選択</div>
        </div>
        <input type="file" id="photo-file-input" accept="image/*" style="display:none" />
        <!-- 画像プレビュー＆色抽出キャンバス -->
        <div class="lm-photo-preview-wrap" id="photo-preview-wrap">
          <canvas id="photo-canvas"></canvas>
          <div class="lm-cursor-ring" id="cursor-ring"></div>
          <div class="lm-pick-hint" data-i18n="pickHint">タップして色を抽出</div>
        </div>
        <!-- 抽出した色プレビュー -->
        <div class="lm-extracted-preview" id="extracted-preview">
          <div class="lm-extracted-swatch" id="extracted-swatch"></div>
          <div class="lm-extracted-info">
            <div class="lm-extracted-hex" id="extracted-hex">#BE185D</div>
            <div class="lm-extracted-label" data-i18n="extractedLabel">抽出した色</div>
          </div>
          <button class="lm-use-color-btn" id="use-color-btn" data-i18n="useColorBtn">この色で検索</button>
        </div>
      </div>

      <!-- ── カラーピッカーエリア ── -->
      <div class="lm-color-area" id="color-area">
        <!-- Color ring + hex display -->
        <div class="lm-picker-row">
          <div class="lm-ring-wrap">
            <!-- 破線の外リング -->
            <div class="lm-ring-dashed"></div>
            <!-- 破線とカラー円の間の白い余白 -->
            <div class="lm-ring-gap"></div>
            <!-- カラー表示円 -->
            <div id="color-preview"></div>
            <!-- 透明なカラーピッカー（全体タップ可能） -->
            <input type="color" id="color-input" value="#BE185D" />
          </div>
          <div class="lm-hex-info">
            <span id="hex-label">#BE185D</span>
            <span class="lm-tap-hint" data-i18n="tapHint">丸をタップして色を選択</span>
          </div>
        </div>
        <!-- RGB sliders (display only, synced to color-input) -->
        <div class="lm-sliders">
          <div class="lm-slider-row">
            <span class="lm-slider-label">R</span>
            <input class="lm-range lm-range-r" type="range" id="slider-r" min="0" max="255" value="190" />
            <span class="lm-slider-val" id="val-r">190</span>
          </div>
          <div class="lm-slider-row">
            <span class="lm-slider-label">G</span>
            <input class="lm-range lm-range-g" type="range" id="slider-g" min="0" max="255" value="24" />
            <span class="lm-slider-val" id="val-g">24</span>
          </div>
          <div class="lm-slider-row">
            <span class="lm-slider-label">B</span>
            <input class="lm-range lm-range-b" type="range" id="slider-b" min="0" max="255" value="93" />
            <span class="lm-slider-val" id="val-b">93</span>
          </div>
        </div>

    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      return {
        r: parseInt(clean.substring(0, 2), 16),
        g: parseInt(clean.substring(2, 4), 16),
        b: parseInt(clean.substring(4, 6), 16)
      };
    }

    function updateSliderStyle(slider, channel) {
      const val = parseInt(slider.value);
      const pct = (val / 255) * 100;
      const c = {
        r: { fill: '#C07070', empty: '#F0D8D8' },
        g: { fill: '#70A870', empty: '#D8EDD8' },
        b: { fill: '#7090C8', empty: '#D8E0F0' }
      }[channel];
      slider.style.background =
        `linear-gradient(to right, ${c.fill} 0%, ${c.fill} ${pct}%, ${c.empty} ${pct}%, ${c.empty} 100%)`;
    }

    function syncSlidersFromHex(hex) {
      const { r, g, b } = hexToRgb(hex);
      sliderR.value = r; valR.textContent = r; updateSliderStyle(sliderR, 'r');
      sliderG.value = g; valG.textContent = g; updateSliderStyle(sliderG, 'g');
      sliderB.value = b; valB.textContent = b; updateSliderStyle(sliderB, 'b');
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => Number(v).toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function applyColor(hex) {
      colorPreview.style.backgroundColor = hex;
      hexLabel.textContent = hex.toUpperCase();
    }

    // 色系統を判定する関数
    function getColorCategory(r, g, b) {
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2 / 255;
      const d = max - min;
      const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1)) / 255;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
        else if (max === g) h = ((b - r) / d + 2) * 60;
        else h = ((r - g) / d + 4) * 60;
      }
      // 彩度が低い場合
      if (s < 0.12) {
        if (l > 0.85) return 'ホワイト系';
        if (l > 0.6) return 'ベージュ系';
        if (l > 0.3) return 'グレー系';
        return 'ダーク系';
      }
      // 明度が非常に低い
      if (l < 0.15) return 'ダーク系';
      // 色相で分類
      if (h < 10 || h >= 350) return 'レッド系';
      if (h < 25) return 'コーラル系';
      if (h < 40) return 'オレンジ系';
      if (h < 50) return 'ベージュ系';
      if (h < 70) return 'ブラウン系';
      if (h < 170) return 'グリーン系';
      if (h < 260) return 'ブルー系';
      if (h < 290) return 'パープル系';
      if (h < 330) return 'モーブ・ローズ系';
      return 'ピンク系';
    }

    // Color matching function
    function calculateMatch(hex1, hex2) {
      const rgb1 = hexToRgb(hex1);
      const rgb2 = hexToRgb(hex2);
      const dist = Math.sqrt(
        Math.pow(rgb1.r - rgb2.r, 2) +
        Math.pow(rgb1.g - rgb2.g, 2) +
        Math.pow(rgb1.b - rgb2.b, 2)
      );
      return Math.round(Math.max(0, 100 - (dist / 4.4)));
    }

      // ブランド分散: まず各ブランドから1件ずつ選ぶ
      const seenBrands = {};
      const diverse = [];
      for (const item of sorted) {
        if (!seenBrands[item.brand]) {
          seenBrands[item.brand] = true;
          diverse.push(item);
          if (diverse.length >= 6) break;
        }
      }
      // 6件未満なら残りで補完（ブランド重複OK）
      if (diverse.length < 6) {
        const pickedIds = new Set(diverse.map(d => d.id));
        for (const item of sorted) {
          if (!pickedIds.has(item.id)) {
            diverse.push(item);
            if (diverse.length >= 6) break;
          }
        }
      }

      renderResults(diverse);
    });

    function translateProductName(name, lang) {
      if (lang === 'ja') return name;
      const dict = productNameI18n[lang];
      if (!dict) return name;
      // 製品名部分（色番号の前の部分）を検索して置換
      for (const [ja, translated] of Object.entries(dict)) {
        if (name.includes(ja)) {
          return name.replace(ja, translated);
        }
      }
      return name;
    }

    let currentLang = 'ja';

    function switchLang(lang) {
      currentLang = lang;
      const t = i18n[lang];

      // Update page title
      document.getElementById('page-title').textContent = t.title;

      // Update all data-i18n elements
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerHTML = t[key];
      });

      // Update body font
      document.body.style.fontFamily = t.fontBody;

      // Update lang-btn active state
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
        if ((lang === 'ja' && btn.textContent === 'JP') ||
            (lang === 'ko' && btn.textContent === 'KR') ||
            (lang === 'en' && btn.textContent === 'EN')) {
          btn.classList.add('active');
        }
      });

      // Update html lang attribute
      document.documentElement.lang = lang;

      // Re-render results if visible
      if (resultsContainer.classList.contains('visible') && lastResults.length > 0) {
        renderResults(lastResults);
      }
    }

    let lastResults = [];

    function renderResults(items) {
      resultsList.innerHTML = '';
      resultsContainer.classList.add('visible');

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.style.animationDelay = `${index * 0.12}s`;
        card.innerHTML = `
          <div class="result-swatch-wrap">
            <div class="result-swatch" style="background:${item.color}"></div>
            <div class="result-badge">${index + 1}</div>
          </div>
          <div class="result-info">
            <p class="result-brand">${item.brand}</p>
            <h3 class="result-name">${translateProductName(item.name, currentLang)}${item.matte ? '<span class="matte-tag">' + i18n[currentLang].matte + '</span>' : ''}</h3>
            <span class="result-hex-chip">${item.color}</span>
            <div class="result-shops">
              ${getQoo10Link(item.brand, item.name, item.url) ? `<a href="${getQoo10Link(item.brand, item.name, item.url)}" class="shop-btn shop-btn-qoo" target="_blank" rel="noopener">Qoo10</a>` : ''}
              ${getAmazonLink(item.brand, item.name, item.url) ? `<a href="${getAmazonLink(item.brand, item.name, item.url)}" class="shop-btn shop-btn-amz" target="_blank" rel="noopener">Amazon</a>` : ''}
            </div>
          </div>
          <div class="result-right">
            <div class="result-pct">${item.matchPercent}<sup>%</sup></div>
            <div class="result-match-label">${i18n[currentLang].match}</div>
            <div class="result-bar"><div class="result-bar-fill" style="width:${item.matchPercent}%"></div></div>
          </div>
        `;
        resultsList.appendChild(card);
      });

      lastResults = items;
      resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // GA4: Qoo10/Amazonクリック記録
      resultsList.querySelectorAll('.shop-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          if (typeof gtag === 'function') {
            const card = this.closest('.result-card');
            const brand = card.querySelector('.result-brand').textContent;
            const name = card.querySelector('.result-name').textContent;
            const shop = this.classList.contains('shop-btn-qoo') ? 'Qoo10' : 'Amazon';
            gtag('event', 'shop_click', {
              shop_name: shop,
              product_brand: brand,
              product_name: name
            });
          }
        });
      });
    }

    // 写真からの色抽出機能
    // ══════════════════════════════════════════

    // モード切り替え（カラーピッカー ↔ 写真抽出）
    function switchMode(mode) {
      const photoArea = document.getElementById('photo-area');
      const colorArea = document.getElementById('color-area');
      const tabColor  = document.getElementById('tab-color');
      const tabPhoto  = document.getElementById('tab-photo');
      if (mode === 'photo') {
        photoArea.style.display = 'block';
        colorArea.style.display = 'none';
        tabColor.classList.remove('active');
        tabPhoto.classList.add('active');
      } else {
        photoArea.style.display = 'none';
        colorArea.style.display = 'block';
        tabColor.classList.add('active');
        tabPhoto.classList.remove('active');
      }
    }

    // DOM参照
    const photoFileInput   = document.getElementById('photo-file-input');
    const photoCanvas      = document.getElementById('photo-canvas');
    const photoCtx         = photoCanvas.getContext('2d');
    const photoPreviewWrap = document.getElementById('photo-preview-wrap');
    const extractedPreview = document.getElementById('extracted-preview');
    const extractedSwatch  = document.getElementById('extracted-swatch');
    const extractedHexEl   = document.getElementById('extracted-hex');
    const cursorRing       = document.getElementById('cursor-ring');
    const uploadZone       = document.getElementById('upload-zone');

    // ファイル選択時の処理
    photoFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          // キャンバスサイズを画像に合わせてセット
          const maxW = 460;
          const scale = Math.min(maxW / img.width, 1);
          photoCanvas.width  = img.width  * scale;
          photoCanvas.height = img.height * scale;
          photoCtx.drawImage(img, 0, 0, photoCanvas.width, photoCanvas.height);
          photoPreviewWrap.classList.add('visible');
          uploadZone.style.display = 'none';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // クリック / タップで色抽出（共通処理）
    function extractColorAt(clientX, clientY) {
      const rect   = photoCanvas.getBoundingClientRect();
      const scaleX = photoCanvas.width  / rect.width;
      const scaleY = photoCanvas.height / rect.height;
      const cx = (clientX - rect.left) * scaleX;
      const cy = (clientY - rect.top)  * scaleY;

      // 5x5ピクセル平均で安定した色を取得
      const r_size = 2;
      const px = photoCtx.getImageData(
        Math.max(0, Math.round(cx) - r_size),
        Math.max(0, Math.round(cy) - r_size),
        r_size * 2 + 1,
        r_size * 2 + 1
      );
      let r = 0, g = 0, b = 0, cnt = 0;
      for (let i = 0; i < px.data.length; i += 4) {
        r += px.data[i]; g += px.data[i+1]; b += px.data[i+2]; cnt++;
      }
      r = Math.round(r / cnt);
      g = Math.round(g / cnt);
      b = Math.round(b / cnt);

      const hex = rgbToHex(r, g, b);

      // カーソルリングをクリック位置に表示
      cursorRing.style.left    = (clientX - rect.left) + 'px';
      cursorRing.style.top     = (clientY - rect.top)  + 'px';
      cursorRing.style.display = 'block';
      cursorRing.style.borderColor = '#fff';
      cursorRing.style.background  = hex + '55';

      // 抽出色プレビューを更新
      extractedSwatch.style.backgroundColor = hex;
      extractedHexEl.textContent             = hex;
      extractedPreview.classList.add('visible');
    }

    // マウスクリック対応
    photoCanvas.addEventListener('click', (e) => {
      extractColorAt(e.clientX, e.clientY);
    });

    // スマホタッチ対応
    photoCanvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      extractColorAt(t.clientX, t.clientY);
    }, { passive: false });

    // 「この色で検索」ボタン
    document.getElementById('use-color-btn').addEventListener('click', () => {
      const hex = extractedHexEl.textContent;
      // カラーピッカーに抽出色を反映
      colorInput.value = hex.toLowerCase();
      applyColor(hex);
      syncSlidersFromHex(hex);
      // カラーピッカータブへ切り替え
      switchMode('color');
      // 自動で検索を実行
      searchBtn.click();
    });
